name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python smoke tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import package
        run: python -c "import dominus_ultra; print('DominusUltra import OK')"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy dominus_ultra.py rope.py benchmark.py demo_speedtest.py gpu_evidence.py

      - name: Compile Python sources
        run: python -m compileall -q dominus_ultra.py rope.py benchmark.py demo_speedtest.py gpu_evidence.py test_dominus.py

      - name: Validate Colab notebook JSON
        run: python -m json.tool colab/DominusUltra_GPU_Evidence.ipynb > /dev/null

      - name: Run tests
        run: pytest -q
